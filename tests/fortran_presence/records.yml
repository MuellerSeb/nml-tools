type: object
x-fortran-namelist: records
required: [entries]
properties:
  entries:
    type: array
    x-fortran-shape: [n_records, 2]
    items:
      type: object
      x-fortran-type: entry_t
      required: [left, right]
      properties:
        left:
          type: integer
        right:
          type: integer
        note:
          type: string
          x-fortran-len: 4
        flag:
          type: boolean
          default: true
  known:
    type: array
    x-fortran-shape: [2]
    items:
      type: object
      x-fortran-type: known_t
      properties:
        value:
          type: integer
          default: 7
  context:
    type: object
    x-fortran-type: context_t
    properties:
      value:
        type: integer
        default: 0
