title: Run configuration
description: General controls for the gravity simulation.
x-fortran-namelist: run
type: object
required: [body_count, run_id, start_time, time_step_seconds]
properties:
  body_count:
    title: Number of falling bodies
    description: Supplies the n_bodies runtime dimension.
    type: integer
    x-fortran-kind: i4
    minimum: 1
    default: 3
  run_id:
    title: Run identifier
    description: Positive identifier for this simulation run.
    type: integer
    x-fortran-kind: i4
    minimum: 1
    default: 1
  label:
    title: Run label
    description: Human-readable label written with the run configuration.
    type: string
    x-fortran-len: 64
    default: gravity-demo
  start_time:
    title: Start time
    description: Date and time at which the simulation begins.
    type: string
    format: date-time
    x-fortran-len: 32
    default: "2026-01-01 00:00"
  time_step_seconds:
    title: Time step in seconds
    description: Duration represented by one simulation step.
    type: number
    x-fortran-kind: dp
    exclusiveMinimum: 0.0
    default: 0.1
  enabled:
    title: Run simulation
    description: Controls whether the configured simulation should run.
    type: boolean
    default: true
  restart_file:
    title: Optional restart file
    description: Existing state file from which the simulation may resume.
    type: string
    format: file-path
    x-fortran-len: 256
    default: ../input/restart_state.dat
