title: Falling bodies
description: Parallel arrays describing the bodies in the simulation.
x-fortran-namelist: bodies
type: object
required: [body_ids, masses, initial_state_files, release_times]
properties:
  body_ids:
    title: Body identifiers
    description: Positive identifiers used to distinguish the simulated bodies.
    type: array
    x-fortran-shape: n_bodies
    items:
      type: integer
      x-fortran-kind: i4
      minimum: 1
    default: [1]
    examples: [[1, 2, 3]]
    x-fortran-default-repeat: true
  masses:
    title: Masses in kilograms
    description: Mass of each body in kilograms.
    type: array
    x-fortran-shape: n_bodies
    items:
      type: number
      x-fortran-kind: dp
      exclusiveMinimum: 0.0
    default: [1.0]
    examples: [[1.0, 2.5, 5.0]]
    x-fortran-default-repeat: true
  names:
    title: Body names
    description: Optional display name for each body.
    type: array
    x-fortran-shape: n_bodies
    items:
      type: string
      x-fortran-len: 32
    examples: [[light, medium, heavy]]
  active:
    title: Active bodies
    description: Enables or disables each body without removing its inputs.
    type: array
    x-fortran-shape: n_bodies
    items:
      type: boolean
    examples: [[true, true, true]]
  initial_state_files:
    title: Initial-state files
    description: File containing the initial state of each body.
    type: array
    x-fortran-shape: n_bodies
    items:
      type: string
      format: file-path
      x-fortran-len: 256
    default: [../input/body_1.csv]
    examples: [[../input/body_1.csv, ../input/body_2.csv, ../input/body_3.csv]]
    x-fortran-default-repeat: true
  release_times:
    title: Release times
    description: Date and time at which each body enters the simulation.
    type: array
    x-fortran-shape: n_bodies
    items:
      type: string
      format: date-time
      x-fortran-len: 32
    default: ["2026-01-01 00:00"]
    examples: [["2026-01-01 00:00", "2026-01-01 00:05", "2026-01-01 00:10"]]
    x-fortran-default-repeat: true
