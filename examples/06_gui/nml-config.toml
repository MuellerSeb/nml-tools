[kinds]
module = "iso_fortran_env"
integer = ["int32"]
real = ["real64"]
map = { i4 = "int32", dp = "real64" }

[dimensions.n_bodies]
default = 3
doc = "Number of falling bodies."

[dimensions.n_snapshots]
default = 2
doc = "Number of requested output snapshots."

[[namelists]]
name = "run"
schema = "schemas/run.yml"

[[namelists]]
name = "gravity"
schema = "schemas/gravity.yml"

[[namelists]]
name = "bodies"
schema = "schemas/bodies.yml"

[[namelists]]
name = "outputs"
schema = "schemas/outputs.yml"

[[file_profiles]]
name = "simulation"
title = "Simulation"
description = "Runtime, gravity, and falling-body inputs."
default_file = "simulation.nml"
namelists = ["run", "gravity", "bodies"]
required = ["run", "gravity", "bodies"]

[[file_profiles]]
name = "reporting"
title = "Reporting"
description = "Shared runtime metadata and output controls."
default_file = "reporting.nml"
namelists = ["run", "outputs"]
required = ["run", "outputs"]
